<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="BookFlow">
  <title>BookFlow</title>
  <!-- Chat bubble (the WhatsApp enquiry) -->
  <path d="M16 33 L11.5 41.5 L24 33 Z" fill="#0E5C4A"/>
  <rect x="7" y="6" width="34" height="28" rx="10" fill="#0E5C4A"/>
  <!-- Flowing checkmark (check it and save) -->
  <path d="M15 20 L21 26 L34 11.5" fill="none" stroke="#FAF7F2" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- New-enquiry / deposit accent -->
  <circle cx="37.5" cy="8.5" r="4" fill="#C8871E" stroke="#FAF7F2" stroke-width="1.7"/>
</svg>
