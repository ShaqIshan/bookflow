<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BookFlow - Setup</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "error": "#ba1a1a",
                      "on-surface": "#1d1b19",
                      "on-primary-fixed-variant": "#005140",
                      "tertiary-fixed-dim": "#ffb4a8",
                      "surface-tint": "#226a57",
                      "on-tertiary-fixed": "#410100",
                      "on-error": "#ffffff",
                      "on-primary-container": "#8dd2bb",
                      "surface-variant": "#e6e2de",
                      "on-secondary": "#ffffff",
                      "tertiary-container": "#952c1f",
                      "on-secondary-container": "#714800",
                      "on-primary": "#ffffff",
                      "primary-fixed-dim": "#8fd4bd",
                      "background": "#FAF7F2",
                      "on-error-container": "#93000a",
                      "tertiary-fixed": "#ffdad4",
                      "surface-bright": "#fdf8f4",
                      "surface-container-high": "#ece7e3",
                      "primary-container": "#0e5c4a",
                      "surface-container-highest": "#e6e2de",
                      "muted-ink": "#8A8478",
                      "on-primary-fixed": "#002018",
                      "surface-container-low": "#f8f3ef",
                      "on-surface-variant": "#3f4945",
                      "on-tertiary-container": "#ffb1a4",
                      "inverse-primary": "#8fd4bd",
                      "on-tertiary-fixed-variant": "#862115",
                      "surface": "#FFFFFF",
                      "surface-container-lowest": "#ffffff",
                      "on-background": "#1d1b19",
                      "primary": "#004334",
                      "surface-dim": "#ded9d5",
                      "on-tertiary": "#ffffff",
                      "secondary": "#835400",
                      "secondary-fixed-dim": "#ffb956",
                      "inverse-on-surface": "#f5f0ec",
                      "inverse-surface": "#32302e",
                      "surface-container": "#f2ede9",
                      "outline": "#6f7975",
                      "secondary-fixed": "#ffddb5",
                      "on-secondary-fixed-variant": "#633f00",
                      "outline-variant": "#bfc9c3",
                      "error-container": "#ffdad6",
                      "tertiary": "#75140a",
                      "secondary-container": "#feb64b",
                      "primary-fixed": "#aaf1d9",
                      "on-secondary-fixed": "#2a1800"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-gap-sm": "8px",
                      "stack-gap-lg": "24px",
                      "stack-gap-md": "16px",
                      "gutter": "12px",
                      "container-margin": "20px"
              },
              "fontFamily": {
                      "display-lg": ["Space Grotesk"],
                      "body-lg": ["Inter"],
                      "stat-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-sm": ["Space Grotesk"],
                      "display-md": ["Space Grotesk"],
                      "label-md": ["Inter"],
                      "display-lg-mobile": ["Space Grotesk"],
                      "body-sm": ["Inter"]
              },
              "fontSize": {
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                      "stat-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "display-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "display-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        /* Ambient card shadow matching design guidance */
        .ambient-shadow {
            box-shadow: 0 4px 15px rgba(22, 21, 19, 0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- TopAppBar from JSON -->
<header class="bg-background flex justify-between items-center px-container-margin py-4 w-full sticky top-0 z-10">
<div class="flex items-center gap-3 hover:opacity-80 transition-all duration-200">
<!-- Replacing Avatar with a Back button for Onboarding context -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
</div>
<h1 class="font-display-md text-display-md-mobile text-primary font-bold tracking-tight">BookFlow</h1>
<div class="flex items-center">
<!-- Empty trailing area for clean onboarding -->
<div class="w-10"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-margin py-stack-gap-lg flex flex-col pb-safe">
<!-- Headers -->
<section class="mb-stack-gap-lg">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-stack-gap-sm">
                What do you run?
            </h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                We'll set up your bookings to match.
            </p>
</section>
<!-- Business Type Grid -->
<section class="grid grid-cols-2 gap-gutter flex-1 content-start">
<!-- Selected Card -->
<button class="bg-surface rounded-xl p-stack-gap-md flex flex-col items-center justify-center text-center ambient-shadow border-2 border-primary relative overflow-hidden transition-all active:scale-95">
<div class="absolute inset-0 bg-primary/5"></div>
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-stack-gap-sm relative z-10 text-primary">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">camera</span>
</div>
<span class="font-headline-sm text-body-md font-semibold text-primary relative z-10">Photo Booth &amp; Events</span>
<!-- Check indicator -->
<div class="absolute top-3 right-3 text-primary relative z-10">
<span class="material-symbols-outlined text-[18px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Unselected Card 2 -->
<button class="bg-surface rounded-xl p-stack-gap-md flex flex-col items-center justify-center text-center ambient-shadow border border-surface-variant hover:border-outline-variant transition-all active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-stack-gap-sm text-on-surface-variant">
<span class="material-symbols-outlined">content_cut</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Barber &amp; Salon</span>
</button>
<!-- Unselected Card 3 -->
<button class="bg-surface rounded-xl p-stack-gap-md flex flex-col items-center justify-center text-center ambient-shadow border border-surface-variant hover:border-outline-variant transition-all active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-stack-gap-sm text-on-surface-variant">
<span class="material-symbols-outlined">hvac</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Aircon &amp; Home Services</span>
</button>
<!-- Unselected Card 4 -->
<button class="bg-surface rounded-xl p-stack-gap-md flex flex-col items-center justify-center text-center ambient-shadow border border-surface-variant hover:border-outline-variant transition-all active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-stack-gap-sm text-on-surface-variant">
<span class="material-symbols-outlined">school</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Tuition &amp; Classes</span>
</button>
<!-- Unselected Card 5 -->
<button class="bg-surface rounded-xl p-stack-gap-md flex flex-col items-center justify-center text-center ambient-shadow border border-surface-variant hover:border-outline-variant transition-all active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-stack-gap-sm text-on-surface-variant">
<span class="material-symbols-outlined">car_rental</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Rentals &amp; Equipment</span>
</button>
<!-- Unselected Card 6 -->
<button class="bg-surface rounded-xl p-stack-gap-md flex flex-col items-center justify-center text-center ambient-shadow border border-surface-variant hover:border-outline-variant transition-all active:scale-95">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-stack-gap-sm text-on-surface-variant">
<span class="material-symbols-outlined">add_circle</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Something else</span>
</button>
</section>
<!-- Actions -->
<section class="mt-auto pt-stack-gap-lg pb-6">
<button class="w-full flex items-center justify-center gap-2 border border-primary text-primary font-label-md text-label-md py-4 rounded-xl mb-stack-gap-sm hover:bg-primary/5 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">table_chart</span>
                Import from Google Sheets
            </button>
<button class="w-full flex items-center justify-center bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl shadow-md hover:opacity-90 transition-opacity active:scale-[0.98]">
                Continue
            </button>
</section>
</main>
<!-- BottomNavBar explicitly suppressed due to Onboarding/Linear intent as per guidelines -->
</body></html>
