<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
      name="viewport"
    />
    <title>BookFlow - Add Booking Preview</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Inter:wght@400;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              error: "#ba1a1a",
              "on-surface": "#1d1b19",
              "on-primary-fixed-variant": "#005140",
              "tertiary-fixed-dim": "#ffb4a8",
              "surface-tint": "#226a57",
              "on-tertiary-fixed": "#410100",
              "on-error": "#ffffff",
              "on-primary-container": "#8dd2bb",
              "surface-variant": "#e6e2de",
              "on-secondary": "#ffffff",
              "tertiary-container": "#952c1f",
              "on-secondary-container": "#714800",
              "on-primary": "#ffffff",
              "primary-fixed-dim": "#8fd4bd",
              background: "#FAF7F2",
              "on-error-container": "#93000a",
              "tertiary-fixed": "#ffdad4",
              "surface-bright": "#fdf8f4",
              "surface-container-high": "#ece7e3",
              "primary-container": "#0e5c4a",
              "surface-container-highest": "#e6e2de",
              "muted-ink": "#8A8478",
              "on-primary-fixed": "#002018",
              "surface-container-low": "#f8f3ef",
              "on-surface-variant": "#3f4945",
              "on-tertiary-container": "#ffb1a4",
              "inverse-primary": "#8fd4bd",
              "on-tertiary-fixed-variant": "#862115",
              surface: "#FFFFFF",
              "surface-container-lowest": "#ffffff",
              "on-background": "#1d1b19",
              primary: "#004334",
              "surface-dim": "#ded9d5",
              "on-tertiary": "#ffffff",
              secondary: "#835400",
              "secondary-fixed-dim": "#ffb956",
              "inverse-on-surface": "#f5f0ec",
              "inverse-surface": "#32302e",
              "surface-container": "#f2ede9",
              outline: "#6f7975",
              "secondary-fixed": "#ffddb5",
              "on-secondary-fixed-variant": "#633f00",
              "outline-variant": "#bfc9c3",
              "error-container": "#ffdad6",
              tertiary: "#75140a",
              "secondary-container": "#feb64b",
              "primary-fixed": "#aaf1d9",
              "on-secondary-fixed": "#2a1800",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "stack-gap-sm": "8px",
              "stack-gap-lg": "24px",
              "stack-gap-md": "16px",
              gutter: "12px",
              "container-margin": "20px",
            },
            fontFamily: {
              "display-lg": ["Space Grotesk"],
              "body-lg": ["Inter"],
              "stat-lg": ["Inter"],
              "body-md": ["Inter"],
              "headline-sm": ["Space Grotesk"],
              "display-md": ["Space Grotesk"],
              "label-md": ["Inter"],
              "display-lg-mobile": ["Space Grotesk"],
              "body-sm": ["Inter"],
            },
            fontSize: {
              "display-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "body-lg": ["18px", { lineHeight: "26px", fontWeight: "400" }],
              "stat-lg": [
                "28px",
                {
                  lineHeight: "34px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-sm": [
                "20px",
                { lineHeight: "28px", fontWeight: "600" },
              ],
              "display-md": [
                "24px",
                {
                  lineHeight: "32px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
              "display-lg-mobile": [
                "28px",
                { lineHeight: "36px", fontWeight: "700" },
              ],
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background min-h-screen flex flex-col pb-safe"
  >
    <!-- TopAppBar -->
    <header
      class="bg-background flex justify-between items-center px-container-margin py-4 w-full sticky top-0 z-40"
    >
      <div class="flex items-center gap-3">
        <button
          class="flex items-center justify-center w-10 h-10 rounded-full hover:opacity-80 transition-all duration-200 active:scale-95 text-on-surface-variant"
        >
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <h1 class="font-display-md text-display-md-mobile text-primary">
          BookFlow
        </h1>
      </div>
      <button
        class="flex items-center justify-center w-10 h-10 rounded-full hover:opacity-80 transition-all duration-200 active:scale-95 text-on-surface-variant"
      >
        <span class="material-symbols-outlined">notifications</span>
      </button>
    </header>
    <!-- Main Content Canvas -->
    <main class="flex-grow px-container-margin pt-stack-gap-sm pb-[180px]">
      <div class="mb-stack-gap-lg">
        <h2
          class="font-display-lg-mobile text-display-lg-mobile text-on-background mb-2"
        >
          Add a booking
        </h2>
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          We filled this in for you — double-check and save.
        </p>
      </div>
      <!-- Parsed Data Card -->
      <div
        class="bg-surface rounded-[20px] p-stack-gap-md shadow-[0_4px_15px_rgba(22,21,19,0.04)] mb-stack-gap-lg"
      >
        <div
          class="flex items-center justify-between mb-4 border-b border-surface-variant pb-3"
        >
          <span
            class="font-label-md text-label-md text-primary bg-primary/10 px-2 py-1 rounded-full flex items-center gap-1"
          >
            <span class="material-symbols-outlined" style="font-size: 14px"
              >auto_awesome</span
            >
            Detected
          </span>
          <button
            class="text-primary font-label-md text-label-md hover:opacity-80"
          >
            EDIT
          </button>
        </div>
        <div class="flex flex-col gap-4">
          <div class="flex gap-3">
            <span class="material-symbols-outlined text-muted-ink mt-0.5"
              >person</span
            >
            <div>
              <label
                class="font-label-md text-label-md text-muted-ink block mb-1"
                >Client name</label
              >
              <div class="font-body-md text-body-md text-on-surface">
                Aisha &amp; Faiz
              </div>
            </div>
          </div>
          <div class="flex gap-3">
            <span class="material-symbols-outlined text-muted-ink mt-0.5"
              >camera_alt</span
            >
            <div>
              <label
                class="font-label-md text-label-md text-muted-ink block mb-1"
                >Service</label
              >
              <div class="font-body-md text-body-md text-on-surface">
                Photo Booth — Wedding
              </div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="flex gap-3">
              <span class="material-symbols-outlined text-muted-ink mt-0.5"
                >calendar_today</span
              >
              <div>
                <label
                  class="font-label-md text-label-md text-muted-ink block mb-1"
                  >Date</label
                >
                <div class="font-body-md text-body-md text-on-surface">
                  26 Jul 2026
                </div>
              </div>
            </div>
            <div class="flex gap-3">
              <span class="material-symbols-outlined text-muted-ink mt-0.5"
                >schedule</span
              >
              <div>
                <label
                  class="font-label-md text-label-md text-muted-ink block mb-1"
                  >Time</label
                >
                <div class="font-body-md text-body-md text-on-surface">
                  7:00 PM – 11:00 PM
                </div>
              </div>
            </div>
          </div>
          <div class="flex gap-3">
            <span class="material-symbols-outlined text-muted-ink mt-0.5"
              >location_on</span
            >
            <div>
              <label
                class="font-label-md text-label-md text-muted-ink block mb-1"
                >Venue</label
              >
              <div class="font-body-md text-body-md text-on-surface">
                Setia City Convention, Shah Alam
              </div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="flex gap-3">
              <span class="material-symbols-outlined text-muted-ink mt-0.5"
                >payments</span
              >
              <div>
                <label
                  class="font-label-md text-label-md text-muted-ink block mb-1"
                  >Price</label
                >
                <div
                  class="font-body-md text-body-md text-on-surface font-semibold"
                >
                  RM 1,800
                </div>
              </div>
            </div>
            <div class="flex gap-3">
              <span class="material-symbols-outlined text-muted-ink mt-0.5"
                >call</span
              >
              <div>
                <label
                  class="font-label-md text-label-md text-muted-ink block mb-1"
                  >Phone</label
                >
                <div class="font-body-md text-body-md text-on-surface">
                  012-345 6789
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Deposit Status -->
      <div class="mb-stack-gap-lg">
        <label
          class="font-label-md text-label-md text-muted-ink block mb-2 px-1"
          >Deposit Status</label
        >
        <div class="bg-surface-variant p-1 rounded-[16px] flex">
          <button
            class="flex-1 py-3 text-center rounded-[12px] font-body-sm text-body-sm font-semibold transition-colors bg-surface text-on-surface shadow-sm"
          >
            Pending
          </button>
          <button
            class="flex-1 py-3 text-center rounded-[12px] font-body-sm text-body-sm font-semibold transition-colors text-muted-ink hover:text-on-surface"
          >
            Paid
          </button>
        </div>
      </div>
    </main>
    <!-- Sticky Bottom Bar (Confirm) -->
    <div
      class="fixed bottom-20 left-0 w-full bg-background/90 backdrop-blur-sm px-container-margin py-4 border-t border-surface-variant z-40"
    >
      <label class="flex items-center gap-2 mb-3 px-1 cursor-pointer">
        <input
          checked=""
          class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface"
          type="checkbox"
        />
        <span class="font-body-sm text-body-sm text-on-surface"
          >Also save to Google Sheet</span
        >
      </label>
      <button
        class="w-full bg-primary text-on-primary font-body-md text-body-md font-semibold h-12 rounded-[14px] flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all"
      >
        Confirm &amp; Save
      </button>
    </div>
    <!-- BottomNavBar -->
    <nav
      class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-safe bg-surface/80 backdrop-blur-md border-t border-outline-variant/30 shadow-[0_-4px_15px_rgba(22,21,19,0.04)] h-20 md:hidden"
    >
      <button
        class="flex flex-col items-center justify-center text-muted-ink hover:text-primary transition-all duration-200"
      >
        <span class="material-symbols-outlined mb-1">home</span>
        <span class="font-label-md text-label-md">Home</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-muted-ink hover:text-primary transition-all duration-200"
      >
        <span class="material-symbols-outlined mb-1">event_available</span>
        <span class="font-label-md text-label-md">Bookings</span>
      </button>
      <button
        class="bg-primary text-on-primary rounded-full w-14 h-14 -mt-8 flex flex-col items-center justify-center shadow-lg hover:opacity-80 transition-all duration-200 active:scale-95"
      >
        <span
          class="material-symbols-outlined"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >add</span
        >
        <span class="sr-only">Add</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-muted-ink hover:text-primary transition-all duration-200"
      >
        <span class="material-symbols-outlined mb-1">calendar_month</span>
        <span class="font-label-md text-label-md">Calendar</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-muted-ink hover:text-primary transition-all duration-200"
      >
        <span class="material-symbols-outlined mb-1">payments</span>
        <span class="font-label-md text-label-md">Money</span>
      </button>
    </nav>
  </body>
</html>
